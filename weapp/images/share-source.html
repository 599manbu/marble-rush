<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a1020}
  .wrap{position:relative;width:100vw;height:100vh;overflow:hidden;
    background:radial-gradient(120% 120% at 20% 10%,#1b2c52 0%,#101a33 52%,#060b18 100%)}
  .glow{position:absolute;width:70%;height:70%;left:55%;top:46%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,213,74,.30),rgba(255,213,74,0) 62%);filter:blur(6px)}
  .track{position:absolute;left:-12%;top:44%;width:124%;height:30%;transform:rotate(-14deg);
    background:linear-gradient(90deg,#243a66,#16233f);border-top:3px solid #6cd0ff;border-bottom:3px solid #2a7fb8;
    box-shadow:0 0 26px rgba(108,208,255,.35)}
  .track i{position:absolute;top:0;width:2.2%;height:100%;background:#0d1730;opacity:.55}
  .ball{position:absolute;left:57%;top:41%;width:19%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#fff6cf 0%,#ffd54a 38%,#c98600 100%);
    box-shadow:0 0 34px rgba(255,213,74,.55), inset -6px -8px 18px rgba(120,70,0,.45)}
  .ball::after{content:'';position:absolute;left:22%;top:16%;width:26%;height:18%;border-radius:50%;
    background:#fff;opacity:.75;transform:rotate(-24deg)}
  .trail{position:absolute;left:27%;top:52%;width:26%;height:9%;border-radius:9px;
    background:linear-gradient(90deg,rgba(255,213,74,0),rgba(255,213,74,.5));filter:blur(2px);transform:rotate(-12deg)}
  .txt{position:absolute;left:7%;top:9%;right:6%}
  .t1{font:900 62px/1.05 "Microsoft YaHei",system-ui,sans-serif;letter-spacing:3px;
    background:linear-gradient(100deg,#ffd54a,#ff8a5c 46%,#6cd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .t2{margin-top:14px;font:600 24px/1.4 "Microsoft YaHei",system-ui,sans-serif;color:#dfe8ff;letter-spacing:1px}
  .t3{margin-top:10px;font:400 18px/1.5 "Microsoft YaHei",system-ui,sans-serif;color:#8ea6cf;letter-spacing:.5px}
  .tag{position:absolute;left:7%;bottom:8%;font:600 17px/1 "Microsoft YaHei",system-ui,sans-serif;
    color:#7ec9a9;letter-spacing:2px;border:1px solid rgba(126,201,169,.5);border-radius:999px;padding:9px 16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="track"><i style="left:18%"></i><i style="left:38%"></i><i style="left:58%"></i><i style="left:78%"></i></div>
  <div class="trail"></div>
  <div class="ball"></div>
  <div class="txt">
    <div class="t1">赛球弹珠竞速</div>
    <div class="t2">上帝视角 · 弹珠障碍竞速</div>
    <div class="t3">冲下机关赛道，和 AI 对手争夺冠军</div>
  </div>
  <div class="tag">来和我比一场 ▶</div>
</div>
</body>
</html>
